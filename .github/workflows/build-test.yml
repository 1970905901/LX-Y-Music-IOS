name: Run build test

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 用 npm ci 而不是 npm install：后者会按 package.json 重新解析版本并可能
      # 悄悄改写 lockfile，CI 结果不再可复现。lockfile 已入库（含四个 GitHub fork
      # 的 commit 固定），ci 能保证 CI 装的依赖与本机一致。
      - name: Install Dependencies
        run: npm ci

      - name: Eslint check
        run: npm run lint

      - name: I18n key check
        run: npm run lint:i18n

      # 类型检查已是硬门禁：`tsc --noEmit` 在本仓当前为零错误（2026-11 复核
      # exit=0），原先的 continue-on-error 基线期结束。Babel/Metro 只剥离类型、
      # 不做检查，类型错误不会让打包失败，所以这里必须自己拦住。
      - name: TypeScript check
        run: npm run typecheck

      - name: Sim contract checks
        run: npm run sim

      - name: Test Build
        run: npm run build-test
