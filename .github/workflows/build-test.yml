name: Run build test

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Eslint check
        run: npm run lint

      - name: I18n key check
        run: npm run lint:i18n

      # 类型检查基线：`tsc --noEmit` 此前从未被任何 npm script 或 workflow 执行过，
      # tsconfig 继承的 strict: true 形同虚设（Babel/Metro 只剥离类型、不做检查）。
      # 本仓存量代码尚未清零类型错误，故先以 continue-on-error 引入：每次 PR 都会把
      # 错误数量与明细打进日志，便于逐步收敛到 0 后再改成硬门禁。
      - name: TypeScript check (baseline, non-blocking)
        continue-on-error: true
        run: npm run typecheck

      - name: Sim contract checks
        run: npm run sim

      - name: Test Build
        run: npm run build-test
