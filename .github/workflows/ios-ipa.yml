name: Build iOS IPA

on:
  push:
    branches:
      - master
      - ios-adaptation
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: iOS IPA
    runs-on: macos-14
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: com.LX-YMusic.shuhao
      DERIVED_DATA_PATH: build/DerivedData
      ARCHIVE_PATH: build/LxMusicMobile.xcarchive
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          gem install cocoapods -v '~> 1.12' --no-document
          cd ios
          # CocoaPods trunk CDN (jsdelivr) occasionally returns 400/404 for spec files; retry on failure
          for attempt in 1 2 3; do
            pod install --repo-update && break
            echo "pod install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
            if [ "$attempt" = "3" ]; then exit 1; fi
          done

      - name: Read package version (date-based)
        shell: bash
        run: |
          PACKAGE_VERSION=$(date +%Y%m%d)
          PACKAGE_VERSION_CODE=$(date +%Y%m%d)
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        shell: bash
        env:
          SOURCEMAP_FILE: ${{ github.workspace }}/build/main.jsbundle.map
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Upload source map artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap
          path: build/main.jsbundle.map
          if-no-files-found: ignore

      - name: Show first Xcode errors
        if: failure()
        shell: bash
        run: |
          echo "===== Xcode errors ====="
          grep -n -C 3 "error:" build/xcodebuild.log | head -120 || true

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          (
            cd build
            zip -qry "$IPA_NAME" Payload
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-LX-Y-Music-v${{ env.PACKAGE_VERSION }}-unsigned
          path: build/LX-Y Music-v${{ env.PACKAGE_VERSION }}-ios-unsigned.ipa

      - name: Publish unsigned IPA to rolling "latest" release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          NOTES="Automated unsigned IPA build from master @ ${{ github.sha }}. Built on ${{ github.run_id }} — do not use as a stable release."
          # 用 gh CLI（原生二进制，不受 Node 24 运行时影响）更新 rolling "latest" release。
          # 原先 softprops/action-gh-release 在 Node 24 强制环境下上传大文件会报
          # "Request body length does not match content-length header"。
          gh release upload latest "build/${IPA_NAME}" --clobber \
            || gh release create latest "build/${IPA_NAME}" --title "Latest Unsigned Build" --prerelease --notes "$NOTES" || true

      - name: Release unsigned IPA
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          gh release create "v${PACKAGE_VERSION}" "build/${IPA_NAME}" \
            --title "v${PACKAGE_VERSION}" --prerelease=false || true
