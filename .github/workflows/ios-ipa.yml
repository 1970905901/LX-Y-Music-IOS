name: Build iOS IPA

on:
  push:
    branches:
      - master
      - ios-adaptation
    tags:
      - 'v*'
  workflow_dispatch:

# 同一分支只保留最新一次运行：连续推送时旧运行自动取消。
# 没有它时每次 push 各排一次 ~10 分钟的 macOS 构建：用户在等最新 IPA，runner 却在
# 打已被取代的旧提交（2026-10-06 一次性推了 7 个修复，队列一度排到 ~40 分钟）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: iOS IPA
    # Xcode 26（Swift 6.2）：液态玻璃的 iOS 26 原生 UIGlassEffect 路径依赖新 SDK 编译
    runs-on: macos-26
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: com.LX-YMusic.shuhao
      DERIVED_DATA_PATH: build/DerivedData
      ARCHIVE_PATH: build/LxMusicMobile.xcarchive
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      # npm ci：按 lockfile 精确安装，保证发布包用的依赖可复现
      - name: Install dependencies
        run: npm ci

      # 发布链此前只跑 sim，跳过 lint / i18n / typecheck —— 也就是说「能打包」即可发布。
      # 这三项都是秒级纯 JS 检查，放在 CocoaPods 之前，失败即止。
      - name: Eslint check
        run: npm run lint

      - name: I18n key check
        run: npm run lint:i18n

      - name: TypeScript check
        run: npm run typecheck

      # 契约脚本（sim-*.js）全量检查：纯 Node 静态断言，秒级完成；
      # 失败即止，不浪费后面的 CocoaPods 与 Xcode 构建时间。
      - name: Sim contract checks
        run: npm run sim

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          gem install cocoapods -v '~> 1.15' --no-document
          cd ios
          # CocoaPods trunk CDN (jsdelivr) occasionally returns 400/404 for spec files; retry on failure
          for attempt in 1 2 3; do
            pod install --repo-update && break
            echo "pod install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
            if [ "$attempt" = "3" ]; then exit 1; fi
          done

      - name: Read package version (date-based)
        shell: bash
        run: |
          # 分钟精度：同日多次构建的 artifact 名可区分（定位「测的是哪个包」）
          PACKAGE_VERSION=$(date +%Y%m%d%H%M)
          PACKAGE_VERSION_CODE=$(date +%Y%m%d%H%M)
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        shell: bash
        env:
          SOURCEMAP_FILE: ${{ github.workspace }}/build/main.jsbundle.map
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Upload source map artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap
          path: build/main.jsbundle.map
          if-no-files-found: ignore

      - name: Show first Xcode errors
        if: failure()
        shell: bash
        run: |
          echo "===== Xcode errors ====="
          grep -n -C 3 "error:" build/xcodebuild.log | head -120 || true

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          (
            cd build
            zip -qry "$IPA_NAME" Payload
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-LX-Y-Music-v${{ env.PACKAGE_VERSION }}-unsigned
          path: build/LX-Y Music-v${{ env.PACKAGE_VERSION }}-ios-unsigned.ipa

      - name: Publish unsigned IPA to rolling "latest" release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ios-adaptation'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          NOTES="Automated unsigned IPA build from ${{ github.ref_name }} @ ${{ github.sha }}. Built on ${{ github.run_id }} — do not use as a stable release."
          # 用 gh CLI（原生二进制，不受 Node 24 运行时影响）更新 rolling "latest" release。
          # 原先 softprops/action-gh-release 在 Node 24 强制环境下上传大文件会报
          # "Request body length does not match content-length header"。
          # 只有「latest release 还不存在」这一种预期内的失败才降级为 create；
          # 其它错误（权限、网络、配额）必须让这一步失败，否则「发布失败但 CI 全绿」。
          gh release upload latest "build/${IPA_NAME}" --clobber \
            || gh release create latest "build/${IPA_NAME}" --title "Latest Unsigned Build" --prerelease --notes "$NOTES"

      - name: Release unsigned IPA
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          # 标签名必须用触发本次构建的原始 tag：此前用 v${PACKAGE_VERSION}（日期版本号），
          # 推 v1.2.3 会创建出 v20260825 这种与标签不符的 release。
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Publishing release ${TAG_NAME}"
          gh release create "${TAG_NAME}" "build/${IPA_NAME}" \
            --title "${TAG_NAME}" --prerelease=false \
            || gh release upload "${TAG_NAME}" "build/${IPA_NAME}" --clobber
